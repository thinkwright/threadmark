<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc">
  <title id="title">Threadmark storage and privacy boundaries</title>
  <desc id="desc">Threadmark keeps redacted excerpts in memory, writes local project state and journal files to disk, sends only redacted checkpoint excerpts to the reflector, and does not persist raw transcripts, raw tool output, or raw hook payloads.</desc>
  <defs>
    <style>
      text {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        fill: #111827;
      }
      .header {
        fill: #ffffff;
        font-size: 15px;
        font-weight: 800;
      }
      .item {
        font-size: 13.5px;
        fill: #374151;
      }
      .column {
        fill: #ffffff;
        stroke-width: 2;
      }
    </style>
  </defs>

  <rect x="10" y="10" width="900" height="320" fill="#f8fafc" stroke="#d1d5db"/>

  <rect class="column" x="36" y="48" width="196" height="244" stroke="#60a5fa"/>
  <rect x="36" y="48" width="196" height="48" fill="#2563eb"/>
  <text class="header" x="134" y="78" text-anchor="middle">Memory Only</text>
  <text class="item" x="134" y="128" text-anchor="middle">redacted event excerpts</text>
  <text class="item" x="134" y="156" text-anchor="middle">pending checkpoint state</text>
  <text class="item" x="134" y="184" text-anchor="middle">retry queue while</text>
  <text class="item" x="134" y="204" text-anchor="middle">threadmarkd is alive</text>
  <text class="item" x="134" y="246" text-anchor="middle">dropped on restart</text>

  <rect class="column" x="260" y="48" width="196" height="244" stroke="#f59e0b"/>
  <rect x="260" y="48" width="196" height="48" fill="#d97706"/>
  <text class="header" x="358" y="78" text-anchor="middle">Local Disk</text>
  <text class="item" x="358" y="128" text-anchor="middle">daemon.sock, pid, log</text>
  <text class="item" x="358" y="156" text-anchor="middle">project state.json</text>
  <text class="item" x="358" y="184" text-anchor="middle">append-only journal.md</text>
  <text class="item" x="358" y="212" text-anchor="middle">disabled marker</text>
  <text class="item" x="358" y="246" text-anchor="middle">0600 / 0700 defaults</text>

  <rect class="column" x="484" y="48" width="196" height="244" stroke="#4ade80"/>
  <rect x="484" y="48" width="196" height="48" fill="#16a34a"/>
  <text class="header" x="582" y="78" text-anchor="middle">Reflector Call</text>
  <text class="item" x="582" y="128" text-anchor="middle">redacted checkpoint</text>
  <text class="item" x="582" y="148" text-anchor="middle">excerpt only</text>
  <text class="item" x="582" y="184" text-anchor="middle">factual metadata</text>
  <text class="item" x="582" y="212" text-anchor="middle">configured Claude CLI</text>
  <text class="item" x="582" y="246" text-anchor="middle">skip with no-journal</text>

  <rect class="column" x="708" y="48" width="176" height="244" stroke="#fb7185"/>
  <rect x="708" y="48" width="176" height="48" fill="#e11d48"/>
  <text class="header" x="796" y="78" text-anchor="middle">Not Persisted</text>
  <text class="item" x="796" y="128" text-anchor="middle">raw transcripts</text>
  <text class="item" x="796" y="156" text-anchor="middle">raw tool outputs</text>
  <text class="item" x="796" y="184" text-anchor="middle">raw hook payloads</text>
  <text class="item" x="796" y="212" text-anchor="middle">secret-shaped values</text>
  <text class="item" x="796" y="246" text-anchor="middle">full session logs</text>
</svg>
